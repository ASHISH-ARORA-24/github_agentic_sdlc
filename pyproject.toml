[project]
name = "github-agentic-sdlc"
version = "0.1.0"
description = "Multi-agent GitHub SDLC platform built with LangChain and LangGraph"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Vector database — for chunkers and code_search tool
    "chromadb>=1.5.9",

    # Graph database — for neo4j_loader and graph_tool
    "neo4j>=6.2.0",

    # Environment variables — for Neo4j credentials in .env
    "python-dotenv>=1.2.2",

    # LangChain OpenAI integration — added in Iteration 1
    # Provides ChatOpenAI wrapper and message types (HumanMessage, SystemMessage, AIMessage)
    "langchain-openai>=0.2.0",

    # LangChain core — added in Iteration 3
    # Provides create_tool_calling_agent, AgentExecutor, ChatPromptTemplate
    "langchain>=0.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
