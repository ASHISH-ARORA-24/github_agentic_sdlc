[project]
name = "github-agentic-sdlc"
version = "0.1.0"
description = "Multi-agent GitHub SDLC platform built with LangChain and LangGraph"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Vector database — for chunkers and code_search tool
    "chromadb>=1.5.9",

    # Graph database — for neo4j_loader and graph_tool
    "neo4j>=6.2.0",

    # Environment variables — for Neo4j credentials in .env
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
